[package]
name = "desktop-overlay"
version = "0.2.1"
description = "Cross-Platform Native Desktop Overlay HUD"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "desktop_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
