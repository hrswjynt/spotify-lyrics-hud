<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Lyrics HUD</title>
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('ResizeObserver')) return;
        console.error('WINDOW ERROR:', e.message, e.filename, e.lineno);
        try {
          if (window.__TAURI_INTERNALS__) {
            window.__TAURI_INTERNALS__.invoke('log_from_js', { level: 'ERROR', msg: e.message + ' at ' + e.filename + ':' + e.lineno });
          }
        } catch (_) {}
      });

      window.addEventListener('unhandledrejection', function(e) {
        console.error('UNHANDLED REJECTION:', e.reason);
        try {
          if (window.__TAURI_INTERNALS__) {
            window.__TAURI_INTERNALS__.invoke('log_from_js', { level: 'REJECTION', msg: String(e.reason) });
          }
        } catch (_) {}
      });
    </script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent !important;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
      }
    </style>

  </head>
  <body class="bg-transparent">
    <div id="app" class="w-full h-full bg-transparent"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
